name = "mcd-mcp-proxy"          # 部署后域名: mcd-mcp-proxy.<你的subdomain>.workers.dev
main = "worker.js"
compatibility_date = "2025-01-01"

# 可选: 加 PROXY_KEY 防白嫖
# 1) 填这里 (下面留空则不启用)
# 2) 部署后到 Cloudflare Dashboard → Workers → mcd-mcp-proxy → Settings → Variables 加 PROXY_KEY
# 3) 330 MCP 设置里额外带 header: X-Proxy-Key: <同值>
#
# [vars]
# PROXY_KEY = "随便一长串随机字符"

# 免费版 Workers 每天 10 万次请求, 个人/朋友小圈子完全够用
